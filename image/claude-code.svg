<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 360" width="100%" height="360" style="background: transparent;">
  <defs>
    <!-- Window Drop Shadow -->
    <filter id="terminal-shadow" x="-8%" y="-8%" width="116%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
    <linearGradient id="bar-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f232b" />
      <stop offset="100%" stop-color="#181a20" />
    </linearGradient>
    <linearGradient id="claude-badge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97757" />
      <stop offset="100%" stop-color="#C25A38" />
    </linearGradient>
  </defs>

  <style>
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes spinSparkle {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Overall sequence timeline (12s loop) */
    @keyframes fadeInCommand {
      0%, 4% { opacity: 0; transform: translateY(4px); }
      7%, 93% { opacity: 1; transform: translateY(0); }
      96%, 100% { opacity: 0; }
    }

    @keyframes fadeInThinking {
      0%, 10% { opacity: 0; transform: translateY(4px); }
      14%, 26% { opacity: 1; transform: translateY(0); }
      29%, 100% { opacity: 0; }
    }

    @keyframes fadeInResponse {
      0%, 28% { opacity: 0; transform: translateY(6px); }
      32%, 93% { opacity: 1; transform: translateY(0); }
      96%, 100% { opacity: 0; }
    }

    @keyframes fadeInStatus {
      0%, 45% { opacity: 0; transform: translateY(4px); }
      49%, 93% { opacity: 1; transform: translateY(0); }
      96%, 100% { opacity: 0; }
    }

    .cursor { animation: blink 0.8s infinite; }
    .sparkle { transform-origin: 104px 105px; animation: spinSparkle 3s linear infinite; }
    
    .anim-cmd { animation: fadeInCommand 12s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .anim-thinking { animation: fadeInThinking 12s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .anim-response { animation: fadeInResponse 12s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .anim-status { animation: fadeInStatus 12s cubic-bezier(0.16, 1, 0.3, 1) infinite; }

    .term-font {
      font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'SF Mono', Consolas, Menlo, Monaco, monospace;
    }
  </style>

  <!-- Terminal Window Background -->
  <g filter="url(#terminal-shadow)">
    <!-- Terminal Outer Frame -->
    <rect x="25" y="15" width="700" height="330" rx="12" fill="#14161B" stroke="#2D3139" stroke-width="1.2" />

    <!-- Terminal Header / Title Bar -->
    <path d="M 25,27 A 12,12 0 0,1 37,15 L 713,15 A 12,12 0 0,1 725,27 L 725,48 L 25,48 Z" fill="url(#bar-gradient)" />
    <line x1="25" y1="48" x2="725" y2="48" stroke="#262A32" stroke-width="1" />

    <!-- Window Action Dots -->
    <circle cx="48" cy="31" r="5.5" fill="#EF4444" />
    <circle cx="66" cy="31" r="5.5" fill="#F59E0B" />
    <circle cx="84" cy="31" r="5.5" fill="#10B981" />

    <!-- Window Title -->
    <g class="term-font" font-size="11" fill="#8E96A5" text-anchor="middle">
      <text x="375" y="35" font-weight="500">tavanh@macbook: ~/workspace — claude code</text>
    </g>

    <!-- Claude Badge Pill on Header -->
    <g transform="translate(625, 23)">
      <rect x="0" y="0" width="85" height="17" rx="8.5" fill="#262A34" stroke="#D97757" stroke-width="0.8" />
      <text x="42.5" y="12" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" fill="#D97757" text-anchor="middle">✻ Claude v3.7</text>
    </g>
  </g>

  <!-- Terminal Body Content -->
  <g transform="translate(50, 48)" class="term-font">
    
    <!-- Step 1: User Prompt -->
    <g class="anim-cmd">
      <!-- Prompt glyphs -->
      <text x="0" y="32" font-size="13" font-weight="700" fill="#3B82F6">❯</text>
      <text x="16" y="32" font-size="13" font-weight="600" fill="#E2E8F0">claude</text>
      <text x="74" y="32" font-size="13" fill="#94A3B8">"who is Tavanh?"</text>
    </g>

    <!-- Step 2: Thinking Animation -->
    <g class="anim-thinking">
      <!-- Spinning Claude Asterisk -->
      <g transform="translate(0, 56)">
        <text x="0" y="0" font-size="14" fill="#D97757" class="sparkle">✻</text>
        <text x="18" y="-1" font-size="12" fill="#94A3B8" font-style="italic">Thinking &amp; analyzing profile...</text>
      </g>
    </g>

    <!-- Step 3: Claude Code Output Box -->
    <g class="anim-response">
      <!-- Card Container Box -->
      <rect x="0" y="48" width="650" height="178" rx="8" fill="#1B1E26" stroke="#2D3342" stroke-width="1.2" />
      
      <!-- Claude Header inside Box -->
      <g transform="translate(16, 70)">
        <rect x="0" y="0" width="22" height="22" rx="5" fill="url(#claude-badge)" />
        <text x="11" y="16" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">✻</text>
        <text x="30" y="15" font-size="13" font-weight="700" fill="#F8FAFC">Claude Code</text>
        <rect x="118" y="3" width="56" height="16" rx="4" fill="#2E2422" stroke="#D97757" stroke-width="0.8" />
        <text x="146" y="14" font-size="9.5" font-weight="bold" fill="#E87B56" text-anchor="middle">AGENT</text>
      </g>

      <!-- Profile details -->
      <g transform="translate(16, 110)" font-size="12.5" line-height="20">
        <!-- Name -->
        <text x="0" y="0" fill="#94A3B8">Name:</text>
        <text x="80" y="0" font-weight="700" fill="#FFFFFF">Tavanh Vannala</text>

        <!-- Role -->
        <text x="0" y="24" fill="#94A3B8">Role:</text>
        <text x="80" y="24" font-weight="600" fill="#38BDF8">Passionate Mobile Developer</text>

        <!-- Tech Stack -->
        <text x="0" y="48" fill="#94A3B8">Stack:</text>
        <text x="80" y="48" fill="#A7F3D0">Kotlin</text>
        <text x="130" y="48" fill="#64748B">•</text>
        <text x="145" y="48" fill="#FDE68A">Jetpack Compose</text>
        <text x="270" y="48" fill="#64748B">•</text>
        <text x="285" y="48" fill="#C4B5FD">Android Modern Architecture</text>

        <!-- Focus -->
        <text x="0" y="72" fill="#94A3B8">Mission:</text>
        <text x="80" y="72" fill="#CBD5E1">Turning creative ideas into smooth, high-impact mobile apps ✨</text>
      </g>
    </g>

    <!-- Step 4: Status line & new prompt -->
    <g class="anim-status">
      <!-- Execution Summary Line -->
      <g transform="translate(0, 246)">
        <circle cx="5" cy="-4" r="4" fill="#10B981" />
        <text x="16" y="0" font-size="11.5" fill="#10B981" font-weight="600">Done</text>
        <text x="56" y="0" font-size="11.5" fill="#64748B">in 0.84s · 0 errors · 0 warnings</text>
      </g>

      <!-- Next Prompt with Blinking Cursor -->
      <g transform="translate(0, 272)">
        <text x="0" y="0" font-size="13" font-weight="700" fill="#3B82F6">❯</text>
        <text x="16" y="0" font-size="13" fill="#E2E8F0">claude</text>
        <rect x="70" y="-12" width="8" height="15" fill="#38BDF8" class="cursor" />
      </g>
    </g>

  </g>
</svg>
