<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 160" width="100%" height="160" style="background: transparent;">
  <style>
    @keyframes scrollGround {
      0% { transform: translateX(0); }
      100% { transform: translateX(-48px); }
    }
    @keyframes moveCactus {
      0% { transform: translateX(650px); }
      100% { transform: translateX(-60px); }
    }
    @keyframes autoJump {
      0%, 64% { transform: translateY(0); }
      68% { transform: translateY(-16px); }
      74% { transform: translateY(-48px); }
      77% { transform: translateY(-48px); }
      83% { transform: translateY(-16px); }
      86%, 100% { transform: translateY(0); }
    }
    @keyframes legOne {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes legTwo {
      0%, 49% { opacity: 0; }
      50%, 100% { opacity: 1; }
    }
    @keyframes legVisibility {
      0%, 65% { opacity: 1; }
      66%, 85% { opacity: 0; }
      86%, 100% { opacity: 1; }
    }
    @keyframes jumpLegVisibility {
      0%, 65% { opacity: 0; }
      66%, 85% { opacity: 1; }
      86%, 100% { opacity: 0; }
    }
    @keyframes moveCloud {
      0% { transform: translateX(680px); }
      100% { transform: translateX(-100px); }
    }
    @media (prefers-color-scheme: dark) {
      .pixel-main { fill: #f5f5f5; }
      .pixel-ground { stroke: #888888; fill: #888888; }
      .pixel-cloud { fill: #444444; }
      .pixel-eye { fill: #121212; }
      .text-score { fill: #aaaaaa; }
    }
    @media (prefers-color-scheme: light) {
      .pixel-main { fill: #333333; }
      .pixel-ground { stroke: #777777; fill: #777777; }
      .pixel-cloud { fill: #d5d5d5; }
      .pixel-eye { fill: #ffffff; }
      .text-score { fill: #555555; }
    }
    .dino-container { animation: autoJump 2.6s cubic-bezier(0.3, 0, 0.7, 1) infinite; }
    .cactus-container { animation: moveCactus 2.6s linear infinite; }
    .ground-line { stroke-width: 2; }
    .ground-pattern { animation: scrollGround 0.25s linear infinite; }
    .run-leg-1 { animation: legOne 0.16s steps(1) infinite; }
    .run-leg-2 { animation: legTwo 0.16s steps(1) infinite; }
    .running-legs-group { animation: legVisibility 2.6s steps(1) infinite; }
    .jumping-legs-group { animation: jumpLegVisibility 2.6s steps(1) infinite; }
    .cloud-1 { animation: moveCloud 12s linear infinite; }
    .cloud-2 { animation: moveCloud 16s linear infinite; animation-delay: -7s; }
  </style>

  <text x="630" y="24" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="bold" class="text-score">
    HI 00999  00256
  </text>

  <g class="cloud-1 pixel-cloud">
    <path d="M0,28 h24 v-4 h14 v-4 h20 v4 h16 v4 h10 v8 h-84 z"/>
  </g>
  <g class="cloud-2 pixel-cloud" transform="translate(0, 15)">
    <path d="M0,28 h20 v-4 h12 v-4 h16 v4 h12 v4 h8 v8 h-68 z"/>
  </g>

  <line x1="0" y1="125" x2="650" y2="125" class="pixel-ground ground-line" />

  <g class="ground-pattern pixel-ground">
    <rect x="10" y="129" width="3" height="1"/><rect x="25" y="132" width="6" height="1"/><rect x="42" y="128" width="4" height="1"/>
    <rect x="65" y="131" width="8" height="1"/><rect x="95" y="128" width="5" height="1"/><rect x="120" y="133" width="7" height="1"/>
    <rect x="155" y="129" width="3" height="1"/><rect x="180" y="131" width="9" height="1"/><rect x="215" y="128" width="4" height="1"/>
    <rect x="245" y="132" width="6" height="1"/><rect x="280" y="129" width="5" height="1"/><rect x="310" y="131" width="8" height="1"/>
    <rect x="345" y="128" width="3" height="1"/><rect x="375" y="132" width="7" height="1"/><rect x="410" y="130" width="4" height="1"/>
    <rect x="440" y="128" width="6" height="1"/><rect x="475" y="131" width="8" height="1"/><rect x="510" y="129" width="3" height="1"/>
    <rect x="540" y="133" width="7" height="1"/><rect x="575" y="128" width="5" height="1"/><rect x="605" y="131" width="6" height="1"/>
  </g>

  <g transform="translate(80, 83)">
    <g class="dino-container">
      <g class="pixel-main">
        <rect x="18" y="0" width="20" height="14"/>
        <rect x="38" y="3" width="4" height="8"/>
        <rect x="22" y="3" width="3" height="3" class="pixel-eye"/>
        <rect x="12" y="12" width="18" height="18"/>
        <rect x="6" y="16" width="6" height="12"/>
        <rect x="0" y="20" width="6" height="6"/>
        <rect x="32" y="17" width="4" height="3"/>
        <rect x="35" y="20" width="2" height="3"/>
      </g>
      <g class="running-legs-group pixel-main">
        <g class="run-leg-1">
          <rect x="14" y="30" width="4" height="12"/><rect x="14" y="40" width="6" height="2"/><rect x="24" y="30" width="4" height="6"/>
        </g>
        <g class="run-leg-2">
          <rect x="14" y="30" width="4" height="6"/><rect x="24" y="30" width="4" height="12"/><rect x="24" y="40" width="6" height="2"/>
        </g>
      </g>
      <g class="jumping-legs-group pixel-main">
        <rect x="14" y="30" width="4" height="7"/><rect x="14" y="35" width="6" height="2"/><rect x="24" y="30" width="4" height="5"/>
      </g>
    </g>
  </g>

  <g class="cactus-container pixel-main">
    <rect x="0" y="87" width="6" height="38"/>
    <rect x="-6" y="96" width="6" height="15"/>
    <rect x="-6" y="108" width="8" height="4"/>
    <rect x="6" y="100" width="6" height="13"/>
    <rect x="4" y="109" width="6" height="4"/>
    <rect x="16" y="97" width="5" height="28"/>
    <rect x="12" y="104" width="4" height="10"/>
    <rect x="21" y="106" width="4" height="8"/>
  </g>
</svg>